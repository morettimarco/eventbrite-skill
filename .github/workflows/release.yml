name: Release .skill

# Two ways to release eventbrite-event-management.skill:
#  - Actions tab -> "Release .skill" -> Run workflow, type a version (e.g. v2.0.1).
#    The tag is created on the current main commit; notes come from .github/release-notes.md
#    plus GitHub's auto-generated changelog.
#  - Or push an annotated tag (git tag -a v2.0.1 -m "notes"); its message becomes the notes.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag to create, e.g. v2.0.1"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      SKILL: eventbrite-event-management
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Validate SKILL.md frontmatter
        run: |
          python3 - <<'PY'
          import re, sys, yaml
          s = open("eventbrite-event-management/SKILL.md").read()
          m = re.match(r"^---\n(.*?)\n---", s, re.S)
          if not m: sys.exit("SKILL.md has no frontmatter")
          fm = yaml.safe_load(m.group(1))
          for k in ("name", "description"):
              if not fm.get(k): sys.exit(f"missing {k}")
          if len(fm["description"]) > 1024 or "<" in fm["description"]:
              sys.exit("description too long or contains angle brackets")
          extra = set(fm) - {"name", "description", "license", "allowed-tools", "metadata", "compatibility"}
          if extra: sys.exit(f"unexpected frontmatter keys: {extra}")
          print("SKILL.md OK:", fm["name"])
          PY

      - name: Build .skill
        run: |
          zip -r "$SKILL.skill" "$SKILL" \
            -x "$SKILL/evals/*" "*/__pycache__/*" "*.pyc" "*.apib" "*.DS_Store"
          unzip -l "$SKILL.skill"

      - name: Publish release (tag push)
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "$SKILL.skill" \
            --title "$GITHUB_REF_NAME" --notes-from-tag --verify-tag

      - name: Publish release (manual run)
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "version must look like v2.0.1"; exit 1; }
          gh release create "$VERSION" "$SKILL.skill" \
            --target "$GITHUB_SHA" --title "$VERSION" \
            --notes-file .github/release-notes.md --generate-notes
